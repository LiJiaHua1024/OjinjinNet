[project]
name = "ojinjinnet"
version = "1.2.0"
description = "Ultra-lightweight on-device INT8 ONNX models & benchmark for detecting AI-generated comments in Chinese video/social communities."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
]

[project.optional-dependencies]
eval = [
    "scikit-learn>=1.5.0",
]
train = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "onnx>=1.17.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
]

[project.scripts]
ojinjinnet = "ojinjinnet.infer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojinjinnet"]
